<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#000;overflow:hidden}
body{position:relative;font-family:'Galmuri11';font-weight:700;color:#f2f2ee}
.hud{position:absolute;left:56px;right:56px;top:40px;display:grid;grid-template-columns:1fr 1fr 1fr;font-size:24px;line-height:1.2}
.hud div:nth-child(2){text-align:center}.hud div:nth-child(3){text-align:right}
.logo-wrap{position:absolute;left:50%;top:150px;width:330px;transform:translateX(-50%)}
.emblem{position:absolute;left:50%;top:50%;width:116%;max-width:none;transform:translate(-63.7%,-50%)}
.logo{position:relative;width:100%;display:block}
.ko{position:absolute;left:50%;top:478px;width:300px;transform:translateX(-50%)}
.date{position:absolute;left:0;right:0;top:522px;text-align:center;font-size:52px;line-height:1;text-shadow:3px 0 0 #eb3728,6px 0 0 #0087c9}
.date span{display:inline-block;margin:0 .22em}
</style></head><body>
<div class="hud"><div>Estimate<br>75:00</div><div>Season<br>Winter</div><div>Goal<br>10M WON</div></div>
<div class="logo-wrap"><img class="emblem" src="../assets/emblem.svg"><img class="logo" src="../assets/logo.svg"></div>
<img class="ko" src="../assets/title-ko.svg">
<div class="date">2027. 01. 21<span>-</span>24</div>
</body></html>
